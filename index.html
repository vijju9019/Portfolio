<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Vijay Purandare" />
    <meta name="theme-color" content="#faf8f5" id="theme-color-meta" />
    <link rel="canonical" href="https://github.com/vijju9019" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/vijju9019" />
    <meta property="og:title" content="Vijay Purandare | AI/ML Engineer & Software Developer" />
    <meta property="og:description" content="Building Intelligent Software for the Real World. Explore engineering case studies, GitHub repositories, and interactive ML roadmaps." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vijay Purandare | AI/ML Engineer & Software Developer" />
    <meta name="twitter:description" content="Building Intelligent Software for the Real World. Explore engineering case studies, GitHub repositories, and interactive ML roadmaps." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vijay Purandare",
        "jobTitle": "AI/ML Engineer & Software Developer",
        "url": "https://github.com/vijju9019",
        "sameAs": [
          "https://github.com/vijju9019",
          "https://linkedin.com/in/vijay-purandare"
        ],
        "worksFor": {
          "@type": "Organization",
          "name": "Cambridge Institute of Technology"
        },
        "description": "Computer Science engineer and developer focused on AI, machine learning, full-stack development, and developer tools."
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization script to prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0c0d10');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8f5] dark:bg-[#0c0d10] text-[#1c1917] dark:text-[#f4f4f5] antialiased selection:bg-blue-600/25 selection:text-blue-900 dark:selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
